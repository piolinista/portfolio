<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | Architecture Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Your Name</h1>
    <p>Architectural Designer & 3D Visualizer</p>
  </header>

  <main class="portfolio-gallery">
    <!-- Add your images here. Add loading="lazy" to keep the site fast -->
    <div class="gallery-item">
      <img src="images/project1-render.jpg" alt="Exterior rendering of a brutalist concrete house" loading="lazy">
      <div class="caption">Concrete House, 2024</div>
    </div>
    
    <div class="gallery-item">
      <img src="images/project1-plan.jpg" alt="Floor plan for concrete house" loading="lazy">
      <div class="caption">Ground Floor Plan</div>
    </div>
    
    <div class="gallery-item">
      <img src="images/project2-section.jpg" alt="Transverse section of cultural center" loading="lazy">
      <div class="caption">Cultural Center Section</div>
    </div>
    
    <!-- Copy and paste the .gallery-item block for as many images as you have -->
  </main>

</body>
</html>
